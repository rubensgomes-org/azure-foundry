# =============================================================================
# aif-create
#
# Creates (if needed) the "ai" resource group, an Azure AI Foundry resource
# and a project in it by calling the reusable AIF Create workflow in the
# Terraform IaC `azure-iac` repo. Endpoints and keys are never printed.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Foundry Create Resource and Project

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment to provision.'
        required: true
        type: choice
        options:
          - dev
          - lab

permissions:
  contents: read

concurrency:
  group: foundry-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  aif-create:
    uses: rubensgomes-org/azure-iac/.github/workflows/aif-create.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
