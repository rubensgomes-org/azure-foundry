# =============================================================================
# foundry-model-deploy
#
# Deploys (if needed) a model on the Azure AI Foundry resource created by
# foundry-create, then verifies the deployment is provisioned. Every project
# under the resource can use the deployment. Endpoints and keys are never
# printed.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Foundry Deploy Model

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment holding the Foundry resource.'
        required: true
        type: choice
        options:
          - dev
          - lab
      model_name:
        description: 'Model name.'
        required: true
        type: string
        default: gpt-5-nano
      model_version:
        description: 'Model version.'
        required: true
        type: string
        default: '2025-08-07'
      model_format:
        description: 'Model format (provider).'
        required: true
        type: choice
        default: OpenAI
        options:
          - OpenAI
          - DeepSeek
          - Meta
          - xAI
          - Mistral AI
      sku_name:
        description: 'Deployment SKU.'
        required: true
        type: choice
        default: GlobalStandard
        options:
          - GlobalStandard
          - DataZoneStandard
          - Standard
      capacity:
        description: 'Capacity in thousands of tokens per minute.'
        required: true
        type: string
        default: '1'
      deployment_name:
        description: 'Deployment name. Default: the model name.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: foundry-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  resolve-names:
    runs-on: ubuntu-latest
    outputs:
      resource_group: ${{ steps.resolve.outputs.resource_group }}
      foundry_resource: ${{ steps.resolve.outputs.foundry_resource }}
      deployment_name: ${{ steps.resolve.outputs.deployment_name }}
    steps:
      # Naming convention for the RG is owned by azure-iac rg-create.yml.
      - id: resolve
        env:
          WORKLOAD: ${{ vars.TF_VAR_workload || 'rgomes' }}
          ENV_NAME: ${{ inputs.environment_name }}
          MODEL_NAME: ${{ inputs.model_name }}
          DEPLOYMENT_INPUT: ${{ inputs.deployment_name }}
          CAPACITY: ${{ inputs.capacity }}
        run: |
          echo "=============================================================="
          echo " STEP: Validate inputs and resolve the resource names"
          echo "=============================================================="
          set -euo pipefail
          deployment_pattern='^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          foundry_resource="aif-${WORKLOAD}-${ENV_NAME}"
          deployment="${DEPLOYMENT_INPUT:-$MODEL_NAME}"
          if ! printf '%s' "$deployment" | grep -qE "$deployment_pattern"
          then
            echo "Invalid deployment name '${deployment}': use 1-64" \
              "alphanumerics, '.', '_' or '-', starting alphanumeric." >&2
            exit 1
          fi
          if ! printf '%s' "$CAPACITY" | grep -qE '^[1-9][0-9]*$'; then
            echo "Invalid capacity '${CAPACITY}': use a positive" \
              "integer." >&2
            exit 1
          fi
          {
            echo "resource_group=rg-${WORKLOAD}ai-${ENV_NAME}"
            echo "foundry_resource=${foundry_resource}"
            echo "deployment_name=${deployment}"
          } >> "$GITHUB_OUTPUT"
          echo "Resource group:   rg-${WORKLOAD}ai-${ENV_NAME}"
          echo "Foundry resource: ${foundry_resource}"
          echo "Deployment:       ${deployment}"

  deploy:
    needs: resolve-names
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ needs.resolve-names.outputs.resource_group }}
      FOUNDRY_RESOURCE: ${{ needs.resolve-names.outputs.foundry_resource }}
      DEPLOYMENT_NAME: ${{ needs.resolve-names.outputs.deployment_name }}
      MODEL_NAME: ${{ inputs.model_name }}
      MODEL_VERSION: ${{ inputs.model_version }}
      MODEL_FORMAT: ${{ inputs.model_format }}
      SKU_NAME: ${{ inputs.sku_name }}
      CAPACITY: ${{ inputs.capacity }}
    steps:
      - name: Sign in to Azure
        uses: rubensgomes-org/azure-workflows/.github/actions/azure-login@v0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the model
        run: |
          echo "=============================================================="
          echo " STEP: Deploy ${MODEL_NAME} as ${DEPLOYMENT_NAME}"
          echo "=============================================================="
          set -euo pipefail
          if ! az cognitiveservices account show \
              --name "$FOUNDRY_RESOURCE" \
              --resource-group "$RESOURCE_GROUP" \
              -o none 2>/dev/null; then
            echo "Foundry resource '${FOUNDRY_RESOURCE}' does not exist;" \
              "run foundry-create first." >&2
            exit 1
          fi
          if az cognitiveservices account deployment show \
              --name "$FOUNDRY_RESOURCE" \
              --resource-group "$RESOURCE_GROUP" \
              --deployment-name "$DEPLOYMENT_NAME" \
              -o none 2>/dev/null; then
            echo "Deployment '${DEPLOYMENT_NAME}' already exists; skipping."
            exit 0
          fi
          az cognitiveservices account deployment create \
            --name "$FOUNDRY_RESOURCE" \
            --resource-group "$RESOURCE_GROUP" \
            --deployment-name "$DEPLOYMENT_NAME" \
            --model-name "$MODEL_NAME" \
            --model-version "$MODEL_VERSION" \
            --model-format "$MODEL_FORMAT" \
            --sku-name "$SKU_NAME" \
            --sku-capacity "$CAPACITY" \
            -o none

      - name: Verify the deployment status
        run: |
          echo "=============================================================="
          echo " STEP: Verify the deployment status"
          echo "=============================================================="
          set -euo pipefail
          az cognitiveservices account deployment show \
            --name "$FOUNDRY_RESOURCE" \
            --resource-group "$RESOURCE_GROUP" \
            --deployment-name "$DEPLOYMENT_NAME" \
            --query '{model: properties.model.name,
                      version: properties.model.version,
                      sku: sku.name, capacity: sku.capacity,
                      state: properties.provisioningState}' \
            -o table
          state="$(az cognitiveservices account deployment show \
            --name "$FOUNDRY_RESOURCE" \
            --resource-group "$RESOURCE_GROUP" \
            --deployment-name "$DEPLOYMENT_NAME" \
            --query properties.provisioningState -o tsv)"
          if [ "$state" != "Succeeded" ]; then
            echo "Deployment '${DEPLOYMENT_NAME}' is '${state}'." >&2
            exit 1
          fi
