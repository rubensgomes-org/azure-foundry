# =============================================================================
# srch-destroy
#
# DESTRUCTIVE. Reverses srch-create by calling the reusable Search Destroy
# workflow in the Terraform IaC `azure-iac` repo: deletes the Azure AI
# Search service and its storage account with every blob in it. The "ai"
# resource group is kept.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: AI Search Destroy

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment holding AI Search.'
        required: true
        type: choice
        options:
          - dev
          - lab
      confirm:
        description: >
          DESTROYS THE AI SEARCH SERVICE AND ITS STORAGE.
          Choose "Yes" to confirm.
        required: true
        type: choice
        default: "No"
        options:
          - "No"
          - "Yes"

permissions:
  contents: read

concurrency:
  group: srch-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  srch-destroy:
    uses: rubensgomes-org/azure-iac/.github/workflows/srch-destroy.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      confirm: ${{ inputs.confirm }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
