# =============================================================================
# aif-destroy
#
# DESTRUCTIVE. Reverses aif-create by calling the reusable AIF Destroy
# workflow in the Terraform IaC `azure-iac` repo: deletes the Azure AI
# Foundry project and resource, with every model deployment on it, then
# purges the soft-deleted resource. The "ai" resource group is kept.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Foundry Destroy Project and Resource

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment holding the Foundry resources.'
        required: true
        type: choice
        options:
          - dev
          - lab
      confirm:
        description: >
          DESTROYS THE FOUNDRY PROJECT AND RESOURCE.
          Choose "Yes" to confirm.
        required: true
        type: choice
        default: "No"
        options:
          - "No"
          - "Yes"

permissions:
  contents: read

concurrency:
  group: foundry-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  aif-destroy:
    uses: rubensgomes-org/azure-iac/.github/workflows/aif-destroy.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      confirm: ${{ inputs.confirm }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
