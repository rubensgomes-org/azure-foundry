# =============================================================================
# aif-project-create
#
# Creates an Azure AI Foundry project, proj-<workload>ai<name>-<env>-<region>,
# under the Foundry resource that aif-create created in the same environment
# and location, by calling the reusable AIF Project Create workflow in the
# Terraform IaC `azure-iac` repo. Existing projects are never replaced.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Foundry Create Project

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment holding the Foundry resource.'
        required: true
        type: choice
        options:
          - dev
          - lab
      location:
        description: 'Region for Foundry. Empty uses TF_VAR_FOUNDRY_LOCATION.'
        required: false
        type: string
        default: ''
      name:
        description: 'Appended to <workload>ai in the project name.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: foundry-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  aif-project-create:
    uses: rubensgomes-org/azure-iac/.github/workflows/aif-project-create.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      location: ${{ inputs.location }}
      name: ${{ inputs.name }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
