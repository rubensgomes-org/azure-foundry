# =============================================================================
# foundry-destroy-all
#
# DESTRUCTIVE. Reverses foundry-create-all by calling the reusable Foundry
# Destroy All workflow in the Terraform IaC `azure-iac` repo: deletes the
# Foundry resource and project, the Container Apps and their dependencies,
# the registry with its images, and the resource groups.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Foundry Destroy All

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment to destroy.'
        required: true
        type: choice
        options:
          - dev
          - lab
      acr_name:
        description: 'Registry to destroy.'
        required: true
        type: choice
        options:
          - crrgomesdev01
          - crrgomeslab02
      apps:
        description: 'JSON array of app names, e.g. ["api","worker"].'
        required: true
        type: string
      confirm:
        description: >
          DESTROYS FOUNDRY, THE CONTAINER APPS, THE REGISTRY AND ITS IMAGES,
          AND ALL RESOURCE GROUPS. Choose "Yes" to confirm.
        required: true
        type: choice
        default: "No"
        options:
          - "No"
          - "Yes"

permissions:
  contents: read

concurrency:
  group: foundry-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  foundry-destroy-all:
    uses: rubensgomes-org/azure-iac/.github/workflows/foundry-destroy-all.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      acr_name: ${{ inputs.acr_name }}
      apps: ${{ inputs.apps }}
      confirm: ${{ inputs.confirm }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
