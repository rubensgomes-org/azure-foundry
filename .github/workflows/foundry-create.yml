# =============================================================================
# foundry-create
#
# Creates (if needed) the "ai" resource group by calling the reusable RG
# Create workflow in the Terraform IaC `azure-iac` repo, then creates (if
# needed) an Azure AI Foundry account and project in it, and verifies both
# are provisioned. Endpoints and keys are never printed.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: foundry-create

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment to provision.'
        required: true
        type: choice
        options:
          - dev
          - lab
      account_name:
        description: 'Foundry account name. Default: aif-<workload>-<env>.'
        required: false
        type: string
      project_name:
        description: 'Foundry project name. Default: proj-<workload>-<env>.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: foundry-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  resolve-names:
    runs-on: ubuntu-latest
    outputs:
      resource_group: ${{ steps.resolve.outputs.resource_group }}
      account_name: ${{ steps.resolve.outputs.account_name }}
      project_name: ${{ steps.resolve.outputs.project_name }}
    steps:
      # Naming convention for the RG is owned by azure-iac rg-create.yml.
      - id: resolve
        env:
          WORKLOAD: ${{ vars.TF_VAR_workload || 'rgomes' }}
          ENV_NAME: ${{ inputs.environment_name }}
          ACCOUNT_INPUT: ${{ inputs.account_name }}
          PROJECT_INPUT: ${{ inputs.project_name }}
        run: |
          echo "=============================================================="
          echo " STEP: Resolve the resource names"
          echo "=============================================================="
          set -euo pipefail
          name_pattern='^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$'
          account="${ACCOUNT_INPUT:-aif-${WORKLOAD}-${ENV_NAME}}"
          project="${PROJECT_INPUT:-proj-${WORKLOAD}-${ENV_NAME}}"
          for name in "$account" "$project"; do
            if ! printf '%s' "$name" | grep -qE "$name_pattern"; then
              echo "Invalid name '${name}': use 2-64 lowercase" \
                "alphanumerics or hyphens, starting and ending" \
                "alphanumeric." >&2
              exit 1
            fi
          done
          {
            echo "resource_group=rg-${WORKLOAD}ai-${ENV_NAME}"
            echo "account_name=${account}"
            echo "project_name=${project}"
          } >> "$GITHUB_OUTPUT"
          echo "Resource group: rg-${WORKLOAD}ai-${ENV_NAME}"
          echo "Account:        ${account}"
          echo "Project:        ${project}"

  rg-create:
    uses: rubensgomes-org/azure-iac/.github/workflows/rg-create.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      purpose: ai
      dry_run: false
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  foundry:
    needs: [resolve-names, rg-create]
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ needs.resolve-names.outputs.resource_group }}
      ACCOUNT_NAME: ${{ needs.resolve-names.outputs.account_name }}
      PROJECT_NAME: ${{ needs.resolve-names.outputs.project_name }}
      LOCATION: ${{ vars.TF_VAR_LOCATION }}
    steps:
      - name: Sign in to Azure
        uses: rubensgomes-org/azure-workflows/.github/actions/azure-login@v0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create the Foundry account
        run: |
          echo "=============================================================="
          echo " STEP: Create the Foundry account ${ACCOUNT_NAME}"
          echo "=============================================================="
          set -euo pipefail
          if az cognitiveservices account show \
              --name "$ACCOUNT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              -o none 2>/dev/null; then
            echo "Account '${ACCOUNT_NAME}' already exists; skipping."
            exit 0
          fi
          az cognitiveservices account create \
            --name "$ACCOUNT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --kind AIServices \
            --sku S0 \
            --location "$LOCATION" \
            --custom-domain "$ACCOUNT_NAME" \
            --assign-identity \
            --allow-project-management true \
            --yes \
            -o none

      - name: Create the Foundry project
        run: |
          echo "=============================================================="
          echo " STEP: Create the Foundry project ${PROJECT_NAME}"
          echo "=============================================================="
          set -euo pipefail
          if az cognitiveservices account project show \
              --name "$ACCOUNT_NAME" \
              --project-name "$PROJECT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              -o none 2>/dev/null; then
            echo "Project '${PROJECT_NAME}' already exists; skipping."
            exit 0
          fi
          az cognitiveservices account project create \
            --name "$ACCOUNT_NAME" \
            --project-name "$PROJECT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            -o none

      # --query keeps the endpoint out of the public log.
      - name: Verify the deployment status
        run: |
          echo "=============================================================="
          echo " STEP: Verify the deployment status"
          echo "=============================================================="
          set -euo pipefail
          account_state="$(az cognitiveservices account show \
            --name "$ACCOUNT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.provisioningState -o tsv)"
          project_state="$(az cognitiveservices account project show \
            --name "$ACCOUNT_NAME" \
            --project-name "$PROJECT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.provisioningState -o tsv)"
          echo "Account '${ACCOUNT_NAME}': ${account_state}"
          echo "Project '${PROJECT_NAME}': ${project_state}"
          if [ "$account_state" != "Succeeded" ] \
              || [ "$project_state" != "Succeeded" ]; then
            echo "Provisioning did not succeed." >&2
            exit 1
          fi
