# =============================================================================
# foundry-create
#
# Creates (if needed) the "ai" resource group by calling the reusable RG
# Create workflow in the Terraform IaC `azure-iac` repo, then creates (if
# needed) an Azure AI Foundry resource and project in it, grants the user
# access to the project, and verifies both are provisioned. Endpoints and
# keys are never printed.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Create Foundry Resource/Project

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment to provision.'
        required: true
        type: choice
        options:
          - dev
          - lab
      project_name:
        description: 'Foundry project name. Default: proj-<workload>-<env>.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: foundry-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  resolve-names:
    runs-on: ubuntu-latest
    outputs:
      resource_group: ${{ steps.resolve.outputs.resource_group }}
      foundry_resource: ${{ steps.resolve.outputs.foundry_resource }}
      project_name: ${{ steps.resolve.outputs.project_name }}
    steps:
      # Naming convention for the RG is owned by azure-iac rg-create.yml.
      - id: resolve
        env:
          WORKLOAD: ${{ vars.TF_VAR_workload || 'rgomes' }}
          ENV_NAME: ${{ inputs.environment_name }}
          PROJECT_INPUT: ${{ inputs.project_name }}
        run: |
          echo "=============================================================="
          echo " STEP: Resolve the resource names"
          echo "=============================================================="
          set -euo pipefail
          name_pattern='^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$'
          foundry_resource="aif-${WORKLOAD}-${ENV_NAME}"
          project="${PROJECT_INPUT:-proj-${WORKLOAD}-${ENV_NAME}}"
          for name in "$foundry_resource" "$project"; do
            if ! printf '%s' "$name" | grep -qE "$name_pattern"; then
              echo "Invalid name '${name}': use 2-64 lowercase" \
                "alphanumerics or hyphens, starting and ending" \
                "alphanumeric." >&2
              exit 1
            fi
          done
          {
            echo "resource_group=rg-${WORKLOAD}ai-${ENV_NAME}"
            echo "foundry_resource=${foundry_resource}"
            echo "project_name=${project}"
          } >> "$GITHUB_OUTPUT"
          echo "Resource group:   rg-${WORKLOAD}ai-${ENV_NAME}"
          echo "Foundry resource: ${foundry_resource}"
          echo "Project:          ${project}"

  rg-create:
    uses: rubensgomes-org/azure-iac/.github/workflows/rg-create.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      purpose: ai
      dry_run: false
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  foundry:
    needs: [resolve-names, rg-create]
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ needs.resolve-names.outputs.resource_group }}
      FOUNDRY_RESOURCE: ${{ needs.resolve-names.outputs.foundry_resource }}
      FOUNDRY_PROJECT: ${{ needs.resolve-names.outputs.project_name }}
      LOCATION: centralus
      SKU: S0
    steps:
      - name: Sign in to Azure
        uses: rubensgomes-org/azure-workflows/.github/actions/azure-login@v0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create the Foundry resource
        run: |
          echo "=============================================================="
          echo " STEP: Create the Foundry resource ${FOUNDRY_RESOURCE}"
          echo "=============================================================="
          set -euo pipefail
          if az cognitiveservices account show \
              --name "$FOUNDRY_RESOURCE" \
              --resource-group "$RESOURCE_GROUP" \
              -o none 2>/dev/null; then
            echo "Foundry resource '${FOUNDRY_RESOURCE}' already exists;" \
              "skipping."
            exit 0
          fi
          az cognitiveservices account create \
            --name "$FOUNDRY_RESOURCE" \
            --resource-group "$RESOURCE_GROUP" \
            --kind AIServices \
            --sku "$SKU" \
            --location "$LOCATION" \
            --custom-domain "$FOUNDRY_RESOURCE" \
            --assign-identity \
            --allow-project-management true \
            --yes \
            -o none

      - name: Create the Foundry project
        run: |
          echo "=============================================================="
          echo " STEP: Create the Foundry project ${FOUNDRY_PROJECT}"
          echo "=============================================================="
          set -euo pipefail
          if az cognitiveservices account project show \
              --name "$FOUNDRY_RESOURCE" \
              --project-name "$FOUNDRY_PROJECT" \
              --resource-group "$RESOURCE_GROUP" \
              -o none 2>/dev/null; then
            echo "Project '${FOUNDRY_PROJECT}' already exists; skipping."
            exit 0
          fi
          az cognitiveservices account project create \
            --name "$FOUNDRY_RESOURCE" \
            --project-name "$FOUNDRY_PROJECT" \
            --resource-group "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            -o none

      - name: Grant the user access to the Foundry project
        env:
          USER_OBJ_ID: ${{ vars.USER_OBJ_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ROLE: Azure AI User
        run: |
          echo "=============================================================="
          echo " STEP: Grant the user access to ${FOUNDRY_PROJECT}"
          echo "=============================================================="
          set -euo pipefail
          if [ -z "$USER_OBJ_ID" ]; then
            echo "Actions variable USER_OBJ_ID is not set." >&2
            exit 1
          fi
          scope="/subscriptions/${SUBSCRIPTION_ID}"
          scope+="/resourceGroups/${RESOURCE_GROUP}"
          scope+="/providers/Microsoft.CognitiveServices"
          scope+="/accounts/${FOUNDRY_RESOURCE}/projects/${FOUNDRY_PROJECT}"
          existing="$(az role assignment list \
            --assignee "$USER_OBJ_ID" \
            --role "$ROLE" \
            --scope "$scope" \
            --query 'length(@)' -o tsv)"
          if [ "$existing" != "0" ]; then
            echo "Role '${ROLE}' already assigned; skipping."
            exit 0
          fi
          az role assignment create \
            --role "$ROLE" \
            --assignee-object-id "$USER_OBJ_ID" \
            --assignee-principal-type User \
            --scope "$scope" \
            -o none

      # --query keeps the endpoint out of the public log.
      - name: Verify the deployment status
        run: |
          echo "=============================================================="
          echo " STEP: Verify the deployment status"
          echo "=============================================================="
          set -euo pipefail
          resource_state="$(az cognitiveservices account show \
            --name "$FOUNDRY_RESOURCE" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.provisioningState -o tsv)"
          project_state="$(az cognitiveservices account project show \
            --name "$FOUNDRY_RESOURCE" \
            --project-name "$FOUNDRY_PROJECT" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.provisioningState -o tsv)"
          echo "Foundry resource '${FOUNDRY_RESOURCE}': ${resource_state}"
          echo "Project '${FOUNDRY_PROJECT}': ${project_state}"
          if [ "$resource_state" != "Succeeded" ] \
              || [ "$project_state" != "Succeeded" ]; then
            echo "Provisioning did not succeed." >&2
            exit 1
          fi
