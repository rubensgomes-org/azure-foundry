# =============================================================================
# Foundry Configuration
# =============================================================================
foundry:
  project_endpoint: "https://aif-rgomes-lab-swedencentral.services.ai.azure.com/api/projects/proj-rgomes-lab"
  model: "gpt-6-luna"
  instructions: >-
    You are a friendly assistant. Keep your answers brief.

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
    version: 1
    disable_existing_loggers: false
    formatters:
        # Colors level name and message; plain if stderr is not a TTY 
        # or NO_COLOR. Set environment variable NO_COLOR=true for plain
        # text with no color.
        standard:
            (): colorlog.ColoredFormatter
            fmt: "%(asctime)s %(log_color)s[%(levelname)s]%(reset)s %(fg_147)s%(name)s %(filename)s:%(lineno)d%(reset)s: %(log_color)s%(message)s%(reset)s"
            datefmt: "%H:%M:%S"
            log_colors:
                DEBUG: cyan
                INFO: light_green
                WARNING: yellow
                ERROR: red
                CRITICAL: bold_red
            stream: ext://sys.stderr
    handlers:
        console:
            class: logging.StreamHandler
            formatter: standard
            stream: ext://sys.stderr
    loggers:
        #############################################################
        # ---------- >>> azure_foundry <<< -------------------------#
        #############################################################
        azure_foundry:
            level: DEBUG
            handlers:
                - console
            propagate: false
