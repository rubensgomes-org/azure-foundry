# ====================================================================
# Microsoft Foundry Configuration
# ====================================================================
foundry:
    project_endpoint: "https://aif-rgomes-lab-eastus2.services.ai.azure.com/api/projects/proj-rgomes-lab"
    agent_name: "functions-agent"

# ====================================================================
# SLM or LLM Model Configuration
# ====================================================================
model:
    name: "gpt-4.1-nano"
    # system instructions being provided to the model.
    instructions: >-
        You are an astronomy observations assistant that helps users find
        information about astronomical events and calculate telescope rental
        costs. Use the available tools to assist users with their inquiries.

# ====================================================================
# Logging Configuration
# ====================================================================
logging:
    version: 1
    disable_existing_loggers: false
    formatters:
        # Colors level name and message when logs are being directly
        # sent to computer TTY console.  For plain (no colors) when
        # logs are being sent over the network, set the NO_COLOR
        # environment variable as NO_COLOR=true.
        standard:
            (): colorlog.ColoredFormatter
            fmt: "%(asctime)s %(log_color)s[%(levelname)s]%(reset)s %(fg_147)s%(name)s %(filename)s:%(lineno)d%(reset)s: %(log_color)s%(message)s%(reset)s"
            datefmt: "%H:%M:%S"
            log_colors:
                DEBUG: cyan
                INFO: light_green
                WARNING: yellow
                ERROR: red
                CRITICAL: bold_red
            stream: ext://sys.stderr
    handlers:
        console:
            class: logging.StreamHandler
            formatter: standard
            stream: ext://sys.stderr
    loggers:
        ##############################################################
        # ---------- >>> azure_foundry <<< --------------------------#
        ##############################################################
        azure_foundry:
            level: DEBUG
            handlers:
                - console
            propagate: false

        ##############################################################
        # ---------- >>> ai_utils_lib <<< ---------------------------#
        ##############################################################
        ai_utils_lib:
            level: DEBUG
            handlers:
                - console
            propagate: false

        ##############################################################
        # ---------- >>> azure.identity <<< -------------------------#
        ##############################################################
        azure.identity:
            level: DEBUG
            handlers:
                - console
            propagate: false
